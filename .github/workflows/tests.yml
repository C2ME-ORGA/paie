name: CI

# Stratégie de branches (docs/development/WORKFLOW.md) :
# - feat/* et fix/* partent de `develop` et la ciblent par Pull Request ;
# - `develop` est promue vers `master`, puis `master` vers `production` ;
# - seule `production` peut publier un tag et une GitHub Release (workflow Release).
# Les branches de travail sont donc contrôlées via leur PR.

on:
  push:
    branches:
      - develop
      - master
      - production
  pull_request:
    branches:
      - develop
      - master
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  # Clé de test uniquement : valeur publique, jamais utilisée hors CI,
  # ne remplace aucune clé de production ou de développement.
  APP_KEY: 'base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA='
  # Les tests ne doivent jamais dépendre de MySQL : SQLite en mémoire.
  DB_CONNECTION: sqlite
  DB_DATABASE: ':memory:'

jobs:
  composer:
    name: Composer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, sqlite3, zip
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

  quality:
    name: 'Quality / ${{ matrix.check }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Pest
            command: vendor/bin/pest
          - check: Pint
            command: vendor/bin/pint --test
          - check: PHPStan
            command: vendor/bin/phpstan analyse --no-progress

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, sqlite3, zip
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      # Installation reproductible : `composer.lock` est présent et versionné.
      # Les scripts Composer (package:discover, filament:upgrade) n'exécutent
      # aucune migration ni requête sur une base réelle.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # Installation reproductible : `package-lock.json` est présent et versionné.
      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
