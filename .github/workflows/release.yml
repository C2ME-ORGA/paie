name: Release

# Publication d'une version batiPaie.
#
# Règles :
# - déclenchement manuel uniquement, depuis la branche `production` ;
# - toute autre branche est refusée avant toute publication ;
# - la version est au format MAJOR.MINOR.PATCH (le tag créé est `vX.Y.Z`) ;
# - les contrôles qualité de la CI sont rejoués avant la publication ;
# - aucune release réelle n'est créée par ce fichier tant qu'il n'est pas exécuté.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier, format MAJOR.MINOR.PATCH (ex. 1.0.0)'
        required: true
        type: string

# GITHUB_TOKEN limité au strict nécessaire : créer le tag et la release.
# Accordé au seul job de publication (voir `jobs.release.permissions`).
permissions: {}

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  APP_ENV: testing
  # Clé de test uniquement : valeur publique, jamais utilisée hors CI.
  APP_KEY: 'base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA='
  # Les contrôles de release ne dépendent jamais de MySQL.
  DB_CONNECTION: sqlite
  DB_DATABASE: ':memory:'

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Seul ce job peut écrire dans le dépôt : création du tag et de la release.
    permissions:
      contents: write

    # Environnement de protection : réviseurs requis et branches de déploiement
    # restreintes à `production` doivent être configurés manuellement dans GitHub
    # (Settings → Environments). Voir docs/development/WORKFLOW.md §9.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Ensure the release runs from production
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/production" ]; then
            echo "::error::A release can only be published from the 'production' branch (current ref: ${GITHUB_REF})."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "::error::Checked out commit does not match the release commit."
            exit 1
          fi

          echo "Publishing from ${GITHUB_REF} at ${GITHUB_SHA}."

      - name: Validate version and tag availability
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '${VERSION}'. Expected MAJOR.MINOR.PATCH (e.g. 1.0.0)."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, sqlite3, zip
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pest
        run: vendor/bin/pest

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
